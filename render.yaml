# Render Blueprint for Aurex. One click: https://render.com/deploy?repo=https://github.com/pizzatechies/P2P
# (or Dashboard -> New -> Blueprint -> pick this repository).
# Or deploy from the command line with scripts/deploy-render.sh.
services:
  - type: web
    name: aurex
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance; free instances lose data and sleep
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: aurex-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /data/aurex.db
      - key: TRUST_PROXY
        value: "true"
      - key: PAYMENT_RAILS
        value: sandbox
      - key: MASTER_KEY
        generateValue: true
      # APP_URL defaults to the service's own URL (RENDER_EXTERNAL_URL); set it only for a custom domain.
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_SETUP_CODE   # enter it under Settings -> Admin access (with 2FA on) to become admin
        generateValue: true
