AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Aurex on one EC2 server: Docker, Caddy (automatic HTTPS), continuous SQLite backups to S3
  (Litestream), secrets in Parameter Store, access through Session Manager (no SSH needed).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: "Required" }
        Parameters: [AdminEmail]
      - Label: { default: "Alerts (recommended)" }
        Parameters: [AlertEmail]
      - Label: { default: "Domain (optional)" }
        Parameters: [DomainName, HostedZoneId]
      - Label: { default: "Server" }
        Parameters: [InstanceType, VolumeSize, SshCidr, KeyName]
      - Label: { default: "App" }
        Parameters: [PaymentRails, RepositoryUrl, Branch]
      - Label: { default: "Advanced" }
        Parameters: [UbuntuArm64Ami, UbuntuAmd64Ami]
    ParameterLabels:
      AdminEmail: { default: "Admin email" }
      AlertEmail: { default: "Alert email" }
      DomainName: { default: "Domain name" }
      HostedZoneId: { default: "Route 53 hosted zone ID" }

Parameters:
  AdminEmail:
    Type: String
    Description: Email of the Aurex admin. Also used for HTTPS certificate notices.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Must be an email address.
  AlertEmail:
    Type: String
    Default: ""
    Description: >-
      Where to send alarms: site down, backups stopped, disk nearly full, app errors, a broken ledger
      seal, or a hardware fault. AWS emails a confirmation link first; click it. Leave empty for no emails.
    AllowedPattern: "^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    ConstraintDescription: Leave empty or use an email address.
  DomainName:
    Type: String
    Default: ""
    Description: >-
      Optional, e.g. aurex.example.com. Leave empty to use a free <ip>.sslip.io address. With your own
      domain, point an A record at the PublicIp output (or give a Route 53 hosted zone below).
    AllowedPattern: "^$|^([a-z0-9]([a-z0-9-]*[a-z0-9])?\\.)+[a-z]{2,}$"
    ConstraintDescription: Leave empty or use a lowercase domain like aurex.example.com.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional Route 53 hosted zone ID for the domain; the A record is then created for you.
  InstanceType:
    Type: String
    Default: t4g.small
    AllowedValues: [t4g.small, t4g.medium, t4g.large, t3.small, t3.medium, t3.large]
    Description: t4g (Graviton) is the cheapest. 2 GB (small) runs Aurex comfortably for a start.
  VolumeSize:
    Type: Number
    Default: 20
    MinValue: 12
    MaxValue: 500
    Description: Disk size in GB (encrypted gp3).
  SshCidr:
    Type: String
    Default: ""
    Description: Optional, e.g. 203.0.113.4/32, to allow SSH from your IP. Leave empty and use Session Manager instead.
    AllowedPattern: "^$|^\\d{1,3}(\\.\\d{1,3}){3}/\\d{1,2}$"
  KeyName:
    Type: String
    Default: ""
    Description: Optional EC2 key pair name for SSH. Not needed with Session Manager.
  PaymentRails:
    Type: String
    Default: sandbox
    Description: Payment methods to enable. "sandbox" uses test money; add real providers later in /opt/aurex/src/deploy/server/.env.
  RepositoryUrl:
    Type: String
    Default: https://github.com/pizzatechies/P2P.git
  Branch:
    Type: String
    Default: claude/gifted-ritchie-8xzdk9
  UbuntuArm64Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id
    Description: Latest Ubuntu 24.04 LTS (ARM). Leave as is.
  UbuntuAmd64Ami:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Latest Ubuntu 24.04 LTS (x86). Leave as is.

Conditions:
  IsArm: !Equals [!Select [0, !Split [".", !Ref InstanceType]], t4g]
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]
  MakeRecord: !And [!Condition HasDomain, !Not [!Equals [!Ref HostedZoneId, ""]]]
  AllowSsh: !Not [!Equals [!Ref SshCidr, ""]]
  HasKey: !Not [!Equals [!Ref KeyName, ""]]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  BackupBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackupBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: HttpsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt BackupBucket.Arn, !Sub "${BackupBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: aurex-backups-and-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation]
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${BackupBucket.Arn}/*"
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/aurex/${AWS::StackName}/*
        - PolicyName: aurex-logs-and-metrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aurex/${AWS::StackName}/app:*"
              - Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: "*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": !Sub "Aurex/${AWS::StackName}" } }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurex web traffic (HTTP for certificates and redirects, HTTPS)
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: udp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTP/3 }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIpv6: "::/0", Description: HTTP (IPv6) }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIpv6: "::/0", Description: HTTPS (IPv6) }
        - !If
          - AllowSsh
          - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshCidr, Description: SSH }
          - !Ref AWS::NoValue

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-aurex" }]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        # IMDSv2 only; hop limit 2 lets the backup container use the instance role.
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2
          HttpEndpoint: enabled

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !If [IsArm, !Ref UbuntuArm64Ami, !Ref UbuntuAmd64Ami]
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      KeyName: !If [HasKey, !Ref KeyName, !Ref AWS::NoValue]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-aurex" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/aurex-setup.log) 2>&1
          IP='${ElasticIp}'
          DOMAIN='${DomainName}'
          [ -n "$DOMAIN" ] || DOMAIN="${!IP//./-}.sslip.io"
          # Wait (up to 5 minutes) for the static IP to be attached, so HTTPS can be issued for it.
          for i in $(seq 1 60); do
            T=$(curl -fsS -X PUT http://169.254.169.254/latest/api/token -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
            [ "$(curl -fsS -H "X-aws-ec2-metadata-token: $T" http://169.254.169.254/latest/meta-data/public-ipv4 || true)" = "$IP" ] && break
            sleep 5
          done
          apt-get update -y
          apt-get install -y git
          git clone --depth 1 --branch '${Branch}' '${RepositoryUrl}' /opt/aurex/src
          cd /opt/aurex/src
          ADMIN_EMAIL='${AdminEmail}' DOMAIN="$DOMAIN" BACKUP_BUCKET='${BackupBucket}' AWS_REGION='${AWS::Region}' \
            PARAM_PREFIX='/aurex/${AWS::StackName}' PAYMENT_RAILS='${PaymentRails}' ./deploy/server/install.sh

  IpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: MakeRecord
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: "300"
      ResourceRecords: [!Ref ElasticIp]

  # Restarts the server on new hardware if AWS detects a host problem.
  RecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the Aurex server when the underlying host fails
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions: [{ Name: InstanceId, Value: !Ref Instance }]
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      AlarmActions: [!Sub "arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover", !Ref AlertTopic]

  # ---- Alerts ------------------------------------------------------------------------------------
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Aurex alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # App logs (the installer sends the app container's log here). Kept 90 days.
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aurex/${AWS::StackName}/app"
      RetentionInDays: 90

  AppErrorFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '"[error]"'
      MetricTransformations:
        - { MetricNamespace: !Sub "Aurex/${AWS::StackName}", MetricName: AppErrors, MetricValue: "1", DefaultValue: 0 }

  IntegrityFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '"[integrity]" "verify"'
      MetricTransformations:
        - { MetricNamespace: !Sub "Aurex/${AWS::StackName}", MetricName: IntegrityBroken, MetricValue: "1", DefaultValue: 0 }

  AppErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Aurex logged 5 or more server errors in 5 minutes. See the app log in CloudWatch Logs.
      Namespace: !Sub "Aurex/${AWS::StackName}"
      MetricName: AppErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  IntegrityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The ledger or audit log seal doesn't verify. Treat as possible tampering (runbook section 6.3).
      Namespace: !Sub "Aurex/${AWS::StackName}"
      MetricName: IntegrityBroken
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # Disk use, reported every 10 minutes by the server (set up by install.sh).
  DiskAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The Aurex server's disk is more than 80% full. Free space or increase VolumeSize.
      Namespace: !Sub "Aurex/${AWS::StackName}"
      MetricName: DiskUsedPercent
      Statistic: Maximum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  # Every 5 minutes: is the site answering, and are backups still arriving in S3?
  CheckerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: aurex-checker
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt BackupBucket.Arn
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition: { StringEquals: { "cloudwatch:namespace": !Sub "Aurex/${AWS::StackName}" } }

  Checker:
    Type: AWS::Lambda::Function
    Properties:
      Description: Checks that Aurex answers and that database backups keep arriving
      Runtime: python3.12
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Role: !GetAtt CheckerRole.Arn
      Environment:
        Variables:
          HEALTH_URL: !If
            - HasDomain
            - !Sub "https://${DomainName}/api/health"
            - !Sub
              - "https://${Dashed}.sslip.io/api/health"
              - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
          BACKUP_BUCKET: !Ref BackupBucket
          NAMESPACE: !Sub "Aurex/${AWS::StackName}"
      Code:
        ZipFile: |
          # Reports two metrics: SiteUp (1 or 0) and BackupAgeHours (age of the newest Litestream
          # snapshot; Litestream takes one a day, so more than 26 hours means backups have stopped).
          import os, time, urllib.request
          import boto3

          s3 = boto3.client("s3")
          cw = boto3.client("cloudwatch")

          def site_up(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "aurex-health-check"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return 1 if r.status == 200 else 0
              except Exception as e:
                  print("health check failed:", e)
                  return 0

          def newest_snapshot_age_hours(bucket):
              # Few requests: the generations, then each generation's snapshots (about one a day).
              newest = None
              gens = s3.list_objects_v2(Bucket=bucket, Prefix="aurex/generations/", Delimiter="/").get("CommonPrefixes", [])
              for g in gens:
                  kw = {"Bucket": bucket, "Prefix": g["Prefix"] + "snapshots/"}
                  while True:
                      page = s3.list_objects_v2(**kw)
                      for o in page.get("Contents", []):
                          if newest is None or o["LastModified"] > newest:
                              newest = o["LastModified"]
                      if not page.get("IsTruncated"):
                          break
                      kw["ContinuationToken"] = page["NextContinuationToken"]
              # No snapshot at all counts as very old, so the alarm fires.
              return 9999.0 if newest is None else (time.time() - newest.timestamp()) / 3600

          def handler(event, context):
              up = site_up(os.environ["HEALTH_URL"])
              age = newest_snapshot_age_hours(os.environ["BACKUP_BUCKET"])
              cw.put_metric_data(Namespace=os.environ["NAMESPACE"], MetricData=[
                  {"MetricName": "SiteUp", "Value": up, "Unit": "Count"},
                  {"MetricName": "BackupAgeHours", "Value": round(age, 2), "Unit": "None"},
              ])
              print({"siteUp": up, "backupAgeHours": round(age, 2)})
              return {"siteUp": up, "backupAgeHours": age}

  CheckerSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run the Aurex checker every 5 minutes
      ScheduleExpression: rate(5 minutes)
      Targets: [{ Id: checker, Arn: !GetAtt Checker.Arn }]

  CheckerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Checker
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CheckerSchedule.Arn

  SiteDownAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Aurex hasn't answered its health check for 10 minutes (runbook section 6.1).
      Namespace: !Sub "Aurex/${AWS::StackName}"
      MetricName: SiteUp
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # No data means the checker itself isn't running: alert too.
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

  BackupAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No new database backup snapshot in 26 hours. Check the litestream container (runbook section 4).
      Namespace: !Sub "Aurex/${AWS::StackName}"
      MetricName: BackupAgeHours
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 26
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
      OKActions: [!Ref AlertTopic]

Outputs:
  AppUrl:
    Description: Your Aurex address (HTTPS may take a few minutes after the stack finishes)
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub
        - "https://${Dashed}.sslip.io"
        - Dashed: !Join ["-", !Split [".", !Ref ElasticIp]]
  PublicIp:
    Description: Static IP. With your own domain, create an A record pointing here.
    Value: !Ref ElasticIp
  ConnectToServer:
    Description: Open a browser terminal on the server (Session Manager)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/systems-manager/session-manager/${Instance}?region=${AWS::Region}"
  AdminSetupCode:
    Description: "Systems Manager > Parameter Store > this name > Show decrypted value. Enter it under Settings > Admin access."
    Value: !Sub "/aurex/${AWS::StackName}/ADMIN_SETUP_CODE"
  BackupBucketName:
    Description: S3 bucket with continuous database backups (kept if the stack is deleted)
    Value: !Ref BackupBucket
  SetupLog:
    Description: Where to look if something goes wrong
    Value: "sudo tail -n 100 /var/log/aurex-setup.log"
  AppLogs:
    Description: The app's log in CloudWatch Logs (after install.sh has run with this stack)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Faurex$252F${AWS::StackName}$252Fapp"
  Alarms:
    Description: Alarm status (site, backups, disk, errors, ledger seal)
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#alarmsV2:"
