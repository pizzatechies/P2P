# Aurex on one AWS server: the app, Caddy for automatic HTTPS, and Litestream for continuous
# backups of the database to S3. Started by install.sh; settings come from .env next to this file.
name: aurex

services:
  app:
    build:
      context: ../..
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
    image: aurex:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_PATH: /data/aurex.db
      TRUST_PROXY: "true"
    volumes:
      - aurex-data:/data
    expose:
      - "4000"
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logs

  # Streams every database change to S3 (point-in-time restore). Enabled with COMPOSE_PROFILES=backup.
  litestream:
    image: litestream/litestream:0.3.13
    profiles: [backup]
    restart: unless-stopped
    depends_on: [app]
    command: replicate
    environment:
      LITESTREAM_BUCKET: ${BACKUP_BUCKET:-}
      LITESTREAM_REGION: ${AWS_REGION:-}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_FORCE_PATH_STYLE: ${LITESTREAM_FORCE_PATH_STYLE:-false}
    volumes:
      - aurex-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    logging: *logs

volumes:
  aurex-data:
  caddy-data:
  caddy-config:
